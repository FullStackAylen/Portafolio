<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aylén Rodríguez — Software Developer</title>
    <meta
      name="description"
      content="Building software, exploring ideas, and turning complex problems into thoughtful digital experiences."
    />
    <meta name="theme-color" content="#141414" />

    <!-- Open Graph / Twitter (Fase 7). Dominio de producción: URL estable de Vercel
         (el dominio custom aylenrodriguez.dev no está registrado — DEPLOY.md §4.1).
         Si se recupera un dominio propio, actualizar og:url/canonical/sitemap.xml. -->
    <link rel="canonical" href="https://my-portafolio-beige.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Aylén Rodríguez" />
    <meta property="og:title" content="Aylén Rodríguez — Software Developer" />
    <meta
      property="og:description"
      content="Building software, exploring ideas, and turning complex problems into thoughtful digital experiences."
    />
    <meta property="og:url" content="https://my-portafolio-beige.vercel.app/" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="es_ES" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:url" content="https://my-portafolio-beige.vercel.app/" />

    <!-- Datos estructurados: solo hechos verificados (nombre, rol, GitHub real) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Aylén Rodríguez",
        "jobTitle": "Software Developer",
        "sameAs": ["https://github.com/FullStackAylen"]
      }
    </script>

    <!-- Iconos: SVG con iniciales (AR) sobre los tokens del sistema.
         favicon.ico legacy sigue disponible para navegadores viejos.
         PNG 192/512 del boilerplate CRA fueron eliminados (eran el logo de React). -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Fuentes auto-hospedadas: @font-face inline porque CRA no permite
         referenciar /public desde CSS. Inter (texto) y Bebas Neue (display,
         sustituye Space Grotesk en la dirección Netflix — N1), subset latin
         (EN+ES), SIL OFL 1.1. Preload con URL estable (AGENTS.md §8.6). crossorigin es
         obligatorio aunque sea mismo origen: si falta, el navegador duplica la descarga. -->
    <link rel="preload" href="%PUBLIC_URL%/fonts/Inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="%PUBLIC_URL%/fonts/BebasNeue-latin.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url('%PUBLIC_URL%/fonts/Inter-latin.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Bebas Neue';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('%PUBLIC_URL%/fonts/BebasNeue-latin.woff2') format('woff2');
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
